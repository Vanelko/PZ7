<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <nav class="navbar is-fixed-top" role="navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="index.html">
                <strong>EduPlatform</strong>
            </a>
        </div>

        <div class="navbar-menu">
            <div class="navbar-end">
                <a class="navbar-item" href="index.html">Главная</a>
                <a class="navbar-item" href="contacts.html">Контакты</a>
                <a class="navbar-item" href="faq.html">FAQ</a>
            </div>
        </div>
    </nav>    

    <main class="section" style="margin-top: 4rem;">    
        <div class="container">
            <h1 class="title has-text-centered">Контакты</h1>

            <div class="columns">
                <div class="column">
                    <h2 class="title is-4">Связаться с нами</h2>
                    <p><strong>Email:</strong> support@eduplatform.ru</p>
                    <p><strong>Телефон:</strong> +7 (999) 999-99-99</p>
                    <p><strong>Адрес:</strong> Москва, Пушкино 13</p>
                </div>

                <div class="column">
                    <h2 class="title is-4">Форма обратной связи</h2>

                    <form>
                        <div class="field">
                            <label class="label">Имя</label>
                            <div class="control">
                                <input class="input" type="text" placeholder="Ваше имя">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Email</label>
                            <div class="control">
                                <input class="input" type="email" placeholder="email@example.com">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Сообщение</label>
                            <div class="control">
                                <textarea class="textarea" placeholder="Ваше сообщение"></textarea>
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-link">Отправить</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>    

    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>EduPlatform</strong> © 2025
            </p>
            <p>
                <a><i class="fab fa-vk"></i></a>
                <a><i class="fab fa-telegram"></i></a>
                <a><i class="fab fa-github"></i></a>
            </p>
        </div>
    </footer>    
</body>
</html>
